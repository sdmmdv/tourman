name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  release:
    types: [published]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. TEST
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Install · Lint · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app_admin
          POSTGRES_PASSWORD: admin_secure_pass
          POSTGRES_DB: tournament
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_admin -d tournament"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: app_admin
      DB_PASS: admin_secure_pass
      DB_NAME: tournament
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout pytest-order Faker psycopg2-binary

      - name: Create missing DB roles
        env:
          PGPASSWORD: admin_secure_pass
        run: |
          psql -h localhost -U app_admin -d tournament -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_guest') THEN
                CREATE ROLE app_guest;
              END IF;
            END
            \$\$;
          "

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src --count --max-line-length=120 --statistics --exit-zero

      - name: Run tests
        run: |
          pytest src/tests/test_cli.py -v --tb=short --timeout=30

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            .pytest_cache/
            data/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # 2. PUBLISH DOCKER IMAGE → GitHub Container Registry (ghcr.io)
  # Triggered only on release publish
  # ─────────────────────────────────────────────────────────────────
  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sdmmdv/tourman
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tourman/tourman.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────────────────────────────
  # 3. PUBLISH PYTHON PACKAGE → GitHub Packages (pip)
  # Triggered only on release publish
  # ─────────────────────────────────────────────────────────────────
  publish-python:
    name: Publish Python Package
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          twine upload \
            --repository-url https://maven.pkg.github.com/sdmmdv/tourman \
            --skip-existing \
            dist/*