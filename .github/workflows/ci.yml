name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Install · Lint · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app_admin
          POSTGRES_PASSWORD: admin_secure_pass
          POSTGRES_DB: tournament
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_admin -d tournament"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: app_admin
      DB_PASS: admin_secure_pass
      DB_NAME: tournament
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Lint with flake8
        run: |
          pip install flake8
          # fail on syntax errors or undefined names; warn on style
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src --count --max-line-length=120 --statistics --exit-zero

      - name: Run tests
        run: |
          pytest src/tests/test_cli.py -v --tb=short --timeout=30

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            .pytest_cache/
            data/
          retention-days: 7